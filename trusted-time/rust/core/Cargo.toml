[package]
license = "Apache-2.0"
name = "signer-nts-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "NTS (RFC 8915) client protocol logic for the signer: no_std + alloc, no I/O, no clock, no RNG"

[lib]
name = "signer_nts_core"
doctest = false

# Every dependency without its default features, so none turns on "std"
# (scripts/nts-container.sh checks this with cargo tree). All are in
# nts/crates.allow already.
[dependencies]
aes-siv = { version = "0.7", default-features = false, features = ["alloc"] }
# aes and cmac only to turn on their "zeroize" feature: the expanded AES
# keys and the CMAC state inside aes-siv are then wiped on drop.
aes = { version = "0.8", default-features = false, features = ["zeroize"] }
cmac = { version = "0.7", default-features = false, features = ["zeroize"] }
subtle = { version = "2.6", default-features = false }
zeroize = { version = "1.9", default-features = false }
