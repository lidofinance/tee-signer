# The NTS workspace:
#   .            signer-nts, the staticlib with the C ABI for the Go runner (std)
#   core/        signer-nts-core, the protocol logic (no_std + alloc)
#   nostd-check/ a no_std staticlib that only proves the core builds without std
[workspace]
members = [".", "core", "nostd-check"]
# nostd-check is built on its own, in release (panic = "abort"); a test
# build would bring in std and clash with its panic handler.
default-members = [".", "core"]
resolver = "3"

[workspace.package]
version = "0.0.3"
edition = "2024"
rust-version = "1.94"
publish = false

[package]
license = "GPL-3.0-only"
name = "signer-nts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "NTS time client for the signer: C ABI for the Go runner over signer-nts-core"

[lib]
name = "signer_nts"
crate-type = ["staticlib"]
doctest = false

[dependencies]
signer-nts-core = { path = "core" }

# Tests only: the test server of core/tests/common calls aes-siv itself, apart
# from the client code. Already in the vendored set.
[dev-dependencies]
aes-siv = { version = "0.7", default-features = false, features = ["alloc"] }

# Test builds only: the crypto crates optimized, so the randomized tests run
# in seconds. Our own crates stay unoptimized, with overflow checks. The
# release profile below is not affected.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = "s"
# Fat LTO drops the parts of the standard library nothing reaches, which
# takes the runner's size increase from 1.1 MB to 0.27 MB and the glibc
# warnings about getaddrinfo and getpwuid_r out of the static link.
lto = "fat"
codegen-units = 1
panic = "abort"
debug = 0
overflow-checks = true
incremental = false
