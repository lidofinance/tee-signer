# Checks that need no secrets and no cloud account. Each job runs on a
# fresh Ubuntu runner. Pin the actions to commit SHAs before this is
# enabled on a protected branch.
name: ci

# A pull request tests only what its change needs (scripts/ci-scope.sh);
# a push to main and a manual run test everything. Every job runs and
# reports on every pull request, as the branch rules require; a job with
# nothing to test says why and passes.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOWORK: "off"
  GOTOOLCHAIN: local
  # The build switch (scripts/common.sh): CI builds and tests the mainnet
  # build. scripts/test.sh adds the non-prod dev runners' chain checks.
  CHAIN: mainnet

jobs:
  guards:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: false
      - run: sudo apt-get install -y -qq cloc jq
      - run: make check

  modules:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      # The history, for the diff against the base branch.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      # Sets CI_MODULES, FUZZ_MODULES, CI_CORE, CI_E2E, CI_E2E_GATEWAY and CI_TESTS.
      - name: scope
        # shell: bash runs with pipefail, so a failing ci-scope.sh fails the step.
        shell: bash
        run: bash scripts/ci-scope.sh | tee -a "$GITHUB_ENV"
      - name: no tests
        if: env.CI_MODULES == 'none'
        run: echo "Only docs changed, no module to test."
      - uses: actions/setup-go@v5
        if: env.CI_MODULES != 'none'
        with:
          go-version: "1.26.x"
          cache: false
      - if: env.CI_MODULES != 'none'
        run: bash scripts/deps.sh
      - if: env.CI_MODULES != 'none'
        run: make core
      - if: env.CI_MODULES != 'none'
        run: make nts
      # Tests the modules of CI_MODULES.
      - if: env.CI_MODULES != 'none'
        run: make test-modules
      # Show every failing test with its output, not only the log's tail.
      - if: failure()
        run: |
          grep -h -B2 -A40 -E -- '--- FAIL|^panic:|WARNING: DATA RACE' logs/*.log || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: logs-modules
          path: logs/

  signer-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # The history, for the diff against the base branch.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      # Sets CI_MODULES, FUZZ_MODULES, CI_CORE, CI_E2E, CI_E2E_GATEWAY and CI_TESTS.
      - name: scope
        # shell: bash runs with pipefail, so a failing ci-scope.sh fails the step.
        shell: bash
        run: bash scripts/ci-scope.sh | tee -a "$GITHUB_ENV"
      - name: no tests
        if: env.CI_CORE != '1'
        run: echo "signer-core, markformat and the shared inputs did not change, nothing to test."
      - if: env.CI_CORE == '1'
        run: sudo apt-get install -y -qq clang
      # The vectors come from their pinned releases (sha256 checked).
      - if: env.CI_CORE == '1'
        run: bash signer-core/scripts/fetch.sh
      - if: env.CI_CORE == '1'
        run: make test-core
      - if: env.CI_CORE == '1'
        run: make fuzz-core

  full:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      # The history, for the diff against the base branch.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      # Sets CI_MODULES, FUZZ_MODULES, CI_CORE, CI_E2E, CI_E2E_GATEWAY and CI_TESTS.
      - name: scope
        # shell: bash runs with pipefail, so a failing ci-scope.sh fails the step.
        shell: bash
        run: bash scripts/ci-scope.sh | tee -a "$GITHUB_ENV"
      - name: no tests
        if: env.CI_TESTS != '1'
        run: echo "Only docs changed, nothing to test."
      - uses: actions/setup-go@v5
        if: env.CI_TESTS == '1'
        with:
          go-version: "1.26.x"
          cache: false
      - if: env.CI_TESTS == '1'
        run: bash scripts/deps.sh
      - if: env.CI_TESTS == '1'
        run: bash signer-core/scripts/fetch.sh
      # Runs the parts CI_MODULES, CI_E2E, CI_E2E_GATEWAY and CI_CORE call for.
      - if: env.CI_TESTS == '1'
        run: make test
      - if: env.CI_E2E == '1'
        run: make model
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: logs
          path: logs/
