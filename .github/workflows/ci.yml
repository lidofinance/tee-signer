# Checks that need no secrets and no cloud account. Each job runs on a
# fresh Ubuntu runner, the macos job on macOS runners. Pin the actions to
# commit SHAs before this is enabled on a protected branch.
name: ci

# A pull request tests only what its change needs (scripts/ci-scope.sh);
# a push to main and a manual run test everything. Every job runs and
# reports on every pull request, as the branch rules require; a job with
# nothing to test says why and passes.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOWORK: "off"
  GOTOOLCHAIN: local
  # The build switch (scripts/common.sh): CI builds and tests the mainnet
  # build. scripts/test.sh adds the non-prod dev runners' chain checks.
  CHAIN: mainnet

jobs:
  guards:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26.x"
          cache: false
      - run: sudo apt-get install -y -qq cloc jq
      - run: make check

  modules:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      # The history, for the diff against the base branch.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      # Sets CI_MODULES, FUZZ_MODULES, CI_CORE, CI_E2E, CI_E2E_GATEWAY, CI_TESTS, CI_AWS_TF and CI_DVT.
      - name: scope
        # shell: bash runs with pipefail, so a failing ci-scope.sh fails the step.
        shell: bash
        run: bash scripts/ci-scope.sh | tee -a "$GITHUB_ENV"
      - name: no tests
        if: env.CI_MODULES == 'none'
        run: echo "Only docs changed, no module to test."
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        if: env.CI_MODULES != 'none'
        with:
          go-version: "1.26.x"
          cache: false
      - if: env.CI_MODULES != 'none'
        run: bash scripts/deps.sh
      - if: env.CI_MODULES != 'none'
        run: make core
      - if: env.CI_MODULES != 'none'
        run: make nts
      # Tests the modules of CI_MODULES.
      - if: env.CI_MODULES != 'none'
        run: make test-modules
      # Show every failing test with its output, not only the log's tail.
      - if: failure()
        run: |
          grep -h -B2 -A40 -E -- '--- FAIL|^panic:|WARNING: DATA RACE' logs/*.log || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: logs-modules
          path: logs/

  signer-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # The history, for the diff against the base branch.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      # Sets CI_MODULES, FUZZ_MODULES, CI_CORE, CI_E2E, CI_E2E_GATEWAY, CI_TESTS, CI_AWS_TF and CI_DVT.
      - name: scope
        # shell: bash runs with pipefail, so a failing ci-scope.sh fails the step.
        shell: bash
        run: bash scripts/ci-scope.sh | tee -a "$GITHUB_ENV"
      - name: no tests
        if: env.CI_CORE != '1'
        run: echo "signer-core, markformat and the shared inputs did not change, nothing to test."
      - if: env.CI_CORE == '1'
        run: sudo apt-get install -y -qq clang
      # The vectors come from their pinned releases (sha256 checked).
      - if: env.CI_CORE == '1'
        run: bash signer-core/scripts/fetch.sh
      - if: env.CI_CORE == '1'
        run: make test-core
      - if: env.CI_CORE == '1'
        run: make fuzz-core

  full:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      # The history, for the diff against the base branch.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      # Sets CI_MODULES, FUZZ_MODULES, CI_CORE, CI_E2E, CI_E2E_GATEWAY, CI_TESTS, CI_AWS_TF and CI_DVT.
      - name: scope
        # shell: bash runs with pipefail, so a failing ci-scope.sh fails the step.
        shell: bash
        run: bash scripts/ci-scope.sh | tee -a "$GITHUB_ENV"
      - name: no tests
        if: env.CI_TESTS != '1'
        run: echo "Only docs changed, nothing to test."
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        if: env.CI_TESTS == '1'
        with:
          go-version: "1.26.x"
          cache: false
      - if: env.CI_TESTS == '1'
        run: bash scripts/deps.sh
      - if: env.CI_TESTS == '1'
        run: bash signer-core/scripts/fetch.sh
      # Runs the parts CI_MODULES, CI_E2E, CI_E2E_GATEWAY and CI_CORE call for.
      - if: env.CI_TESTS == '1'
        run: make test
      - if: env.CI_E2E == '1'
        run: make model
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: logs
          path: logs/

  # The dvt variant (DVT in scripts/common.sh): both cores, the checks that
  # the default build holds no dv_share code and that no runner links
  # against the other variant's core, the dvt-tagged Go tests and the DVT
  # core's C suites (make test-dvt). It runs beside the other jobs, which
  # build the default variant only, and has work only when the dvt code,
  # its callers or the variants' build files changed (CI_DVT). Its fuzzing
  # runs nightly (fuzz-nightly.yml).
  dvt:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # The history, for the diff against the base branch.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      # Sets CI_MODULES, FUZZ_MODULES, CI_CORE, CI_E2E, CI_E2E_GATEWAY, CI_TESTS, CI_AWS_TF and CI_DVT.
      - name: scope
        # shell: bash runs with pipefail, so a failing ci-scope.sh fails the step.
        shell: bash
        run: bash scripts/ci-scope.sh | tee -a "$GITHUB_ENV"
      - name: no tests
        if: env.CI_DVT != '1'
        run: echo "The dvt variant's code did not change, nothing to test."
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        if: env.CI_DVT == '1'
        with:
          go-version: "1.26.x"
          cache: false
      # The vectors come from their pinned releases (sha256 checked).
      - if: env.CI_DVT == '1'
        run: bash signer-core/scripts/fetch.sh
      - if: env.CI_DVT == '1'
        run: make test-dvt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: logs-dvt
          path: |
            logs/
            signer-core/build/*-dvt/test-logs/

  # Whether the macos job has work: signer-admin or a module it depends on
  # changed, or a shared input (CI_MODULES is ALL). The scope scripts run
  # here and not on the Mac, whose bash is 3.2.
  macos-scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.scope.outputs.run }}
    steps:
      # The history, for the diff against the base branch.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: scope
        id: scope
        # shell: bash runs with pipefail, so a failing ci-scope.sh fails the step.
        shell: bash
        run: |
          m="$(bash scripts/ci-scope.sh | sed -n 's/^CI_MODULES=//p')"
          case " $m " in
            " ALL " | *" signer-admin "*) run=1 ;;
            *) run=0 ;;
          esac
          echo "run=$run" | tee -a "$GITHUB_OUTPUT"

  # signer-admin on macOS, for the offline steps on a Mac (signer-admin
  # split): the core and signer-admin built with the Mac's own tools
  # (Apple clang, BSD ar and nm, bash 3.2), then the signer-admin tests
  # without a dev runner, and the split round trip onto a RAM disk with
  # the output folder check on (SIGNER_ADMIN_SPLIT_DIR). macos-15 is
  # arm64, macos-15-intel x86_64.
  macos:
    needs: macos-scope
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: no tests
        if: needs.macos-scope.outputs.run != '1'
        run: echo "signer-admin, the modules it uses and the shared inputs did not change, nothing to test."
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: needs.macos-scope.outputs.run == '1'
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        if: needs.macos-scope.outputs.run == '1'
        with:
          go-version: "1.26.x"
          cache: false
      - if: needs.macos-scope.outputs.run == '1'
        run: make admin
      - name: RAM disk
        if: needs.macos-scope.outputs.run == '1'
        # 524288 sectors of 512 bytes: 256 MiB.
        run: |
          dev="$(hdiutil attach -nomount ram://524288 | awk '{ print $1 }')"
          diskutil erasevolume APFS split-ci "$dev"
          echo "SIGNER_ADMIN_SPLIT_DIR=/Volumes/split-ci" >>"$GITHUB_ENV"
      - if: needs.macos-scope.outputs.run == '1'
        working-directory: signer-admin
        run: go vet ./... && go test -race -count=1 ./...
      # The round trip must have run on the RAM disk, not skipped.
      - if: needs.macos-scope.outputs.run == '1'
        working-directory: signer-admin
        shell: bash
        run: |
          go test -count=1 -v -run '^TestSplitRoundTripRealFolder$' ./cmd/signer-admin | tee /tmp/roundtrip.log
          grep -q -- '--- PASS: TestSplitRoundTripRealFolder' /tmp/roundtrip.log

  # terraform validate and terraform test (mock provider) of
  # platform-aws/deploy. No AWS account is used.
  aws-terraform:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # The history, for the diff against the base branch.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      # Sets CI_MODULES, FUZZ_MODULES, CI_CORE, CI_E2E, CI_E2E_GATEWAY, CI_TESTS, CI_AWS_TF and CI_DVT.
      - name: scope
        # shell: bash runs with pipefail, so a failing ci-scope.sh fails the step.
        shell: bash
        run: bash scripts/ci-scope.sh | tee -a "$GITHUB_ENV"
      - name: no tests
        if: env.CI_AWS_TF != '1'
        run: echo "platform-aws/deploy and its Terraform checks did not change, nothing to test."
      # main.tf pins no provider version, so terraform init takes the newest.
      # The cache key is that version.
      - name: provider version
        if: env.CI_AWS_TF == '1'
        shell: bash
        run: |
          v="$(bash scripts/tf-providers.sh latest)"
          echo "TF_AWS_PROVIDER=$v" | tee -a "$GITHUB_ENV"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: tf-providers
        if: env.CI_AWS_TF == '1'
        with:
          path: build/tf-plugins
          key: tf-aws-${{ runner.os }}-${{ runner.arch }}-${{ env.TF_AWS_PROVIDER }}
      - if: env.CI_AWS_TF == '1' && steps.tf-providers.outputs.cache-hit != 'true'
        run: bash scripts/tf-providers.sh build/tf-plugins "$TF_AWS_PROVIDER"
      - if: env.CI_AWS_TF == '1'
        run: TF_PLUGIN_DIR="$PWD/build/tf-plugins" bash scripts/tf-validate.sh
      - if: env.CI_AWS_TF == '1'
        run: TF_PLUGIN_DIR="$PWD/build/tf-plugins" bash scripts/aws-tf-test.sh
